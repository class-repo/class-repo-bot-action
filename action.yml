name: ClassRepo Bot
description: >-
  Creates and manages student repositories for ClassRepo, inside your own GitHub account. It fetches its job from the
  ClassRepo server, opens the encrypted student records with your roster key, and only ever acts within the rules in the README.
author: ClassRepo

inputs:
  batch-id:
    description: Random id of the job to run (the ClassRepo server sets this when it starts the workflow).
    required: true
  server-url:
    description: Address of the ClassRepo server (the ClassRepo server sets this when it starts the workflow).
    required: true
  app-id:
    description: Id of your Executor App (the CLASSREPO_APP_ID secret).
    required: true
  app-private-key:
    description: Private key of your Executor App (the CLASSREPO_APP_PRIVATE_KEY secret).
    required: true
  roster-private-key:
    description: >-
      Your roster private key (the CLASSREPO_ROSTER_PRIVATE_KEY secret). It does not exist yet on the very first run,
      which is the one that creates it.
    required: false
    default: ''
  tracking-repo:
    description: Name of your private repository that records the roster.
    required: false
    default: class-repo-tracking
  allowed-template-owners:
    description: Optional comma-separated owners whose repositories may be used as templates. Empty means no restriction.
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Get a token for your Executor App
      id: app-token
      # Pinned to the exact commit so it cannot change under you.
      uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1.12.0
      with:
        app-id: ${{ inputs.app-id }}
        private-key: ${{ inputs.app-private-key }}
        owner: ${{ github.repository_owner }}

    - name: Run the job
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        ACTION_PATH: ${{ github.action_path }}
        BATCH_ID: ${{ inputs.batch-id }}
        SERVER_URL: ${{ inputs.server-url }}
        EXECUTOR_TOKEN: ${{ steps.app-token.outputs.token }}
        ROSTER_PRIVATE_KEY: ${{ inputs.roster-private-key }}
        TRACKING_REPO: ${{ inputs.tracking-repo }}
        ALLOWED_TEMPLATE_OWNERS: ${{ inputs.allowed-template-owners }}
      with:
        github-token: ${{ steps.app-token.outputs.token }}
        script: |
          const run = require(`${process.env.ACTION_PATH}/scripts/provision.js`);
          await run({ github, context, core });

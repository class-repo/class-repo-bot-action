version: 2
updates:
  # The actions this action itself uses, and its CI. Updates arrive as pull requests; read them before merging.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  # Only used by the tests, to check our calls against the Octokit that github-script ships. Not part of the action.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
